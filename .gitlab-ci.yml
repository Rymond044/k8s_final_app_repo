stages:
  - build
  - update-helm

variables:
  GIT_SSL_NO_VERIFY: "true"
  HELM_REPO_URL: "http://oauth2:${HELM_REPO_PAT}@gitlab.minikube.local/rymond044/final_k8s_helm_repo.git"
  HELM_VALUES_PATH: "helm_apps/charts/web-app/values.yaml"

build_image:
  stage: build
  image: docker:24.0.7
  services:
    - name: docker:24.0.7-dind
      command: ["--insecure-registry=registry.minikube.local"]
  variables:
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: "$CI_COMMIT_TAG =~ /^dev-v.*/"
  script:
    - REGISTRY_HOST=$(echo "$CI_REGISTRY" | sed -e 's|https://||' -e 's|http://||')
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin $REGISTRY_HOST
    - docker build -t "$REGISTRY_HOST/$CI_PROJECT_PATH:$CI_COMMIT_TAG" .
    - docker push "$REGISTRY_HOST/$CI_PROJECT_PATH:$CI_COMMIT_TAG"

update_helm_tag:
  stage: update-helm
  image: alpine:3.19
  rules:
    - if: "$CI_COMMIT_TAG =~ /^dev-v.*/"
  before_script:
    - apk add --no-cache git sed
  script:
    - git config --global user.name "GitLab CI Bot"
    - git config --global user.email "ci-bot@minikube.local"

    - git clone $HELM_REPO_URL helm-repo
    - cd helm-repo

    - sed -i "s/tag:\ .*/tag:\ \"${CI_COMMIT_TAG}\"/" $HELM_VALUES_PATH

    - |
      if git diff --quiet $HELM_VALUES_PATH; then
        echo "Изменений в values.yaml нет."
      else
        git add $HELM_VALUES_PATH
        git commit -m "chore(ci): update image tag to ${CI_COMMIT_TAG} [skip ci]"
        git push origin main
      fi
